name: Install Trivy
description: >-
  Installs a pinned Trivy release from its tarball, verified by sha256, into
  /usr/local/bin. Used instead of aquasecurity/trivy-action and setup-trivy,
  which were hijacked in CVE-2026-33634.

runs:
  using: composite
  steps:
    - name: Install Trivy
      shell: bash
      env:
        # The sha256 comes from the release's checksums file, whose sigstore
        # signature was verified against trivy's release workflow
        # (cosign verify-blob). Bump both together.
        TRIVY_VERSION: 0.76.2
        TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      run: |
        curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
        # Installed into a directory already on PATH rather than writing
        # $GITHUB_PATH, which zizmor flags in composite actions.
        sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
        trivy --version
