# Dependabot version updates (card 2283).
# Dependabot reads this file from the default branch (master), but PRs target
# dev, where pr.yml runs the image scan and lint on them.
version: 2
updates:
  # Base image in Dockerfile, pinned by tag and digest.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a hijacked or broken
    # release has time to be caught and pulled first.
    cooldown:
      default-days: 7
    ignore:
      # Only refresh the digest of python:3.13-slim-bookworm (Debian and Python
      # patch fixes). A move to a new Python minor version is a deliberate
      # upgrade, not a weekly bump.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # SHA-pinned actions in .github/workflows. One grouped PR per week.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # requirements.txt, requirements-dev.txt and constraints.txt, the pins for
  # indirect dependencies (card 2285). Minor and patch
  # updates come as one grouped PR per week. Each major update gets its own PR,
  # since it may need code changes. Security-fix PRs don't wait for the
  # cooldown and aren't grouped. The git-pinned mermaid-inference-contract is
  # not bumped by Dependabot.
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
