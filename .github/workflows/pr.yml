name: pr

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev

permissions:
  contents: read

env:
  ENV: dev
  AWS_DEFAULT_REGION: us-east-1

jobs:

  # Lint Python. Tool versions pinned to match .pre-commit-config.yaml.
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: isort
        uses: isort/isort-action@24d8a7a51d33ca7f36c3f23598dafa33f7071326  # v1.1.1
        with:
          isort-version: "5.12.0"

      - name: ruff check
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b  # v4.0.0
        with:
          version: "0.1.6"
          args: "check"

      - name: ruff format
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b  # v4.0.0
        with:
          version: "0.1.6"
          args: "format --check"

  # Build the API image and scan it with Trivy (see _image-scan.yml).
  image-scan:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_image-scan.yml

  # Lint the Dockerfile (hadolint, config in .hadolint.yaml) and check it for
  # misconfigurations (trivy config). Both report to code scanning. hadolint
  # findings of warning level or above, and HIGH/CRITICAL misconfigurations,
  # fail the job.
  dockerfile-lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # hadolint does not sign releases; this is the sha256 GitHub recorded for
      # the release asset. Bump both together.
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-trivy

      - name: Install hadolint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/hadolint" /usr/local/bin/hadolint
          hadolint --version

      # Reports run first with !cancelled(), so findings reach code scanning
      # even when a gate step below fails.
      - name: hadolint (SARIF)
        id: hadolint-report
        run: hadolint --no-fail --format sarif Dockerfile > hadolint.sarif

      - name: trivy config (SARIF)
        id: trivy-config-report
        if: ${{ !cancelled() }}
        run: trivy config --misconfig-scanners dockerfile --format sarif --output trivy-config.sarif .

      # Fork PRs get a read-only token, so uploads would fail; the gates still run.
      - name: Upload hadolint SARIF
        if: >-
          ${{ !cancelled() && steps.hadolint-report.outcome == 'success'
          && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: hadolint.sarif
          category: hadolint

      - name: Upload trivy config SARIF
        if: >-
          ${{ !cancelled() && steps.trivy-config-report.outcome == 'success'
          && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Gate on hadolint findings
        if: ${{ !cancelled() }}
        run: hadolint Dockerfile

      - name: Gate on Dockerfile misconfigurations
        if: ${{ !cancelled() }}
        run: trivy config --misconfig-scanners dockerfile --severity HIGH,CRITICAL --exit-code 1 .

  # Tests run before deploys (see deploy-cdk.yml), not on every PR. PRs only
  # surface the cdk diff + nag report.
  cdk-diff:
    if: github.event.pull_request.draft == false
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
    # No environment here on purpose: GitHub treats `environment:` as a deploy
    # gate, and dev's protection rules block PR merge refs. cdk-diff is a
    # read-only diff, so it runs un-gated. SLACK_* are repo-level secrets (dev
    # values) so the diff is accurate; the per-env deploy jobs override them
    # with environment secrets.
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6.2.0
        with:
          node-version: '^22.11.0'

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "^3.13.0"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install CDK
        run: |
          cd iac && ./install_cdk.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708  # v5.1.1
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
        with:
          # PR CI assumes the least-privilege read-only role (card 2261 Phase 2), not the
          # AdministratorAccess deploy role. cdk_diff.sh runs `cdk diff --method=template`,
          # which only reads templates/SSM. Role name is non-secret; account from the secret.
          role-to-assume: arn:aws:iam::${{ secrets.CDK_DEFAULT_ACCOUNT }}:role/github-pr-readonly-role
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: CDK Nag
        id: cdk-nag
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          PYTHONPATH: ${{ github.workspace }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
        # cdk-nag v3 runs as a CDK policy validation plugin: every unacknowledged finding
        # (error or warning) fails `cdk synth` and is listed in cdk.out/validation-report.json.
        # A missing report means synth failed before validation ran, so that fails too.
        # Only plugins that concluded "failure" count: CDK's built-in CloudFormation Validate
        # plugin can add advisory warnings under a "success" conclusion.
        working-directory: iac
        run: |
          report=cdk.out/validation-report.json
          rm -f "${report}"
          # Capture synth's status straight from PIPESTATUS (`|| true` would reset it under pipefail).
          set +e
          cdk synth --quiet 2>&1 | tee /tmp/cdk-nag.log
          synth_exit=${PIPESTATUS[0]}
          set -e
          if [ ! -f "${report}" ]; then
            echo "::error::${report} not found: cdk synth failed before cdk-nag ran"
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          elif [ "${synth_exit}" != "0" ] || [ "$(jq '[.pluginReports[] | select(.conclusion == "failure") | .violations[]] | length' "${report}")" != "0" ]; then
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post CDK Nag results to PR
        if: always() && steps.cdk-nag.conclusion != 'skipped'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'iac/cdk.out/validation-report.json';
            const list = (violations) => violations
              .map(v => `- \`${v.ruleName}\`\n` + v.violatingConstructs.map(c => `  - \`${c.constructPath}\``).join('\n'))
              .join('\n');
            let body = '## cdk-nag report\n\n';
            if (!fs.existsSync(reportPath)) {
              body += ':x: **`cdk synth` failed before cdk-nag ran.** See the job log.\n';
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const violations = report.pluginReports
                .filter(p => p.conclusion === 'failure')
                .flatMap(p => p.violations);
              const errors = violations.filter(v => v.severity === 'error');
              const warnings = violations.filter(v => v.severity !== 'error');
              if (violations.length === 0) {
                body += ':white_check_mark: **No unacknowledged findings.**\n';
              }
              if (errors.length > 0) {
                body += `:x: **${errors.length} unacknowledged error(s):**\n\n${list(errors)}\n`;
              }
              if (warnings.length > 0) {
                body += `\n:warning: **${warnings.length} unacknowledged warning(s)** (these also fail the job):\n\n${list(warnings)}\n`;
              }
            }
            body += '\n---\n*See `iac/nag_suppressions.py` to acknowledge accepted risks.*';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('## cdk-nag report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on CDK Nag errors
        if: steps.cdk-nag.outputs.has_errors == 'true'
        run: |
          echo "::error::cdk-nag found unsuppressed errors — see PR comment for details"
          exit 1

      - name: CDK Diff
        id: cdk-diff
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          PYTHONPATH: ${{ github.workspace }}
          SYS_EMAIL: ${{ secrets.SYS_EMAIL }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
        run: |
          cd iac && ./cdk_diff.sh

      - name: Post CDK Diff results to PR
        if: always() && steps.cdk-diff.outcome != 'skipped'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          CDK_DIFF_OUTCOME: ${{ steps.cdk-diff.outcome }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/cdk-diff.log', 'utf8');
            const status = process.env.CDK_DIFF_OUTCOME === 'success' ? 'Success' : 'Failed';
            const icon = status === 'Success' ? ':white_check_mark:' : ':x:';
            const body = [
              `#### \`cdk diff\` ${icon} ${status}`,
              '<details><summary>Show Output</summary>',
              '',
              '```',
              log,
              '```',
              '',
              '</details>',
              '',
              `*Workflow: \`${context.workflow}\`*`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('#### `cdk diff`'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
