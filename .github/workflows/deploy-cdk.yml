name: DeployCDKStacks

on:
  push:
    branches:
      - dev
    tags:
      - 'v[0-9]+.[0-9]+'        # eg: v1.1
      - 'v[0-9]+.[0-9]+.[0-9]+' # eg: v1.1.1

      # The following tags allow you to deploy prod on the new AWS account only.
      # TODO: remove after migration
      - 'w[0-9]+.[0-9]+'        # eg: w1.1
      - 'w[0-9]+.[0-9]+.[0-9]+' # eg: w1.1.1

permissions:
  contents: read  # This is required for actions/checkout

jobs:
  call-test:
    uses: ./.github/workflows/_test.yml
    # Pass only the secrets _test.yml declares, instead of inheriting all.
    secrets:
      TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      TEST_POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
      TEST_MERMAID_API_SIGNING_SECRET: ${{ secrets.TEST_MERMAID_API_SIGNING_SECRET }}
      TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}

  deploy:
    needs: [call-test]
    # Job-level, not workflow-level, so the post-deploy aggregate-tests job doesn't hold
    # the deploy lock and make later pushes queue behind it.
    concurrency:
      group: api-deployment-${{ github.ref }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for requesting the OIDC JWT (AWS role assume)
      contents: read   # required for actions/checkout
    # Tag pushes deploy prod; dev-branch pushes deploy dev. Selecting the matching
    # GitHub Environment resolves that env's SLACK_CHANNEL_ID / SLACK_WORKSPACE_ID
    # (and any other environment-scoped secrets); repo-level secrets still resolve.
    environment: ${{ startsWith(github.ref, 'refs/tags') && 'prod' || 'dev' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6.2.0  # zizmor: ignore[cache-poisoning] no `cache:` input set, so no cache is restored
        with:
          node-version: '^22.11.0'

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "^3.13.0"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install CDK
        run: |
          iac/install_cdk.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708  # v5.1.1
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          DEPLOY_AWS_ROLE: ${{ secrets.DEPLOY_AWS_ROLE }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.CDK_DEFAULT_ACCOUNT }}:role/${{ secrets.DEPLOY_AWS_ROLE }}
          role-duration-seconds: 3599
          aws-region: us-east-1
          role-skip-session-tagging: true
      - name: CDK Deploy DEV
        if: startsWith(github.ref, 'refs/heads/dev')
        env:
          DEPLOY_AWS_ROLE: ${{ secrets.DEPLOY_AWS_ROLE }}
          SYS_EMAIL: ${{ secrets.SYS_EMAIL }}
          PYTHONPATH: ${{ github.workspace }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: us-east-1
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
        run: |
          short_sha=$(git rev-parse --short ${{ github.sha }}) && \
          echo "$short_sha" > src/VERSION.txt && \
          cat src/VERSION.txt && \
          cd iac && cdk deploy \
            --require-approval never \
            GithubAccess \
            mermaid-api-infra-common \
            mermaid-cloudtrail \
            "mermaid-guardduty-us-east-1" \
            dev-mermaid-inference \
            dev-mermaid-api-django \
            dev-mermaid-static-site \
            dev-mermaid-sagemaker
      - name: CDK Deploy PROD
        if: startsWith(github.ref, 'refs/tags')
        env:
          DEPLOY_AWS_ROLE: ${{ secrets.DEPLOY_AWS_ROLE }}
          SYS_EMAIL: ${{ secrets.SYS_EMAIL }}
          PYTHONPATH: ${{ github.workspace }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: us-east-1
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$REF_NAME" > src/VERSION.txt && \
          cat src/VERSION.txt && \
          cd iac && cdk deploy \
            --require-approval never \
            GithubAccess \
            mermaid-api-infra-common \
            mermaid-cloudtrail \
            "mermaid-guardduty-us-east-1" \
            prod-mermaid-inference \
            prod-mermaid-api-django \
            prod-mermaid-static-site

  # mermaidr's aggregate-correctness tests (recalculate SU/SE values from the API's
  # observations and compare them with the API's own SU/SE output) against the dev API
  # just deployed. cdk deploy waits for the ECS service to stabilise, so the new code
  # is serving by now. Those tests are skip_on_ci()'d in mermaidr's own CI;
  # CI=false / NOT_CRAN=true below un-skips them.
  aggregate-tests:
    needs: [deploy]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # MERMAIDR_M2M_CLIENT_ID / MERMAIDR_M2M_CLIENT_SECRET live in a dedicated dev-tests
    # environment (not dev, so these runs aren't recorded as dev deployments): an Auth0
    # machine-to-machine app whose MERMAID profile is a read-only member of the mermaidr
    # test projects.
    environment: dev-tests
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      # Pinned: this code runs with a dev-API token. Bump the SHA deliberately after
      # reviewing mermaidr changes. Currently the head of data-mermaid/mermaidr#166
      # (MERMAID_TOKEN / MERMAID_API_URL support); move to its merge commit once merged.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: data-mermaid/mermaidr
          ref: 4cde0fff5dda3f7101600876f7a8901641d0e9be
          path: mermaidr
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true

      # The test files only use mermaidr's Imports; skip its Suggests (tidyverse, etc.).
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: mermaidr
          dependencies: '"hard"'
          extra-packages: any::testthat

      # The token is fetched and used in this one step, so no later step (including
      # third-party post-job steps) can read it.
      - name: Run mermaidr aggregate tests against dev
        working-directory: mermaidr
        shell: bash
        env:
          AUTH0_CLIENT_ID: ${{ secrets.MERMAIDR_M2M_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.MERMAIDR_M2M_CLIENT_SECRET }}
          MERMAID_API_URL: https://dev-api.datamermaid.org
          CI: "false" # un-skips skip_on_ci()
          NOT_CRAN: "true" # un-skips skip_on_cran()
        run: |
          payload=$(jq -n --arg id "$AUTH0_CLIENT_ID" --arg secret "$AUTH0_CLIENT_SECRET" \
            '{grant_type: "client_credentials", client_id: $id, client_secret: $secret, audience: "https://dev-api.datamermaid.org"}')
          if ! response=$(curl -sS --fail-with-body https://datamermaid.auth0.com/oauth/token \
            -H "content-type: application/json" -d "$payload"); then
            echo "::error::Auth0 token request failed: $(jq -r '.error_description // .error // .' <<< "$response")"
            exit 1
          fi
          token=$(jq -r '.access_token // empty' <<< "$response")
          if [ -z "$token" ]; then
            echo "::error::No access token returned by Auth0"
            exit 1
          fi
          echo "::add-mask::$token"

          # No automatic retry: a failure is either a regression or a setup problem, and
          # both should surface. If a test project was edited mid-run (SU/SE read the
          # async summary cache), re-run the job.
          # Fails if any test fails, or if none passed (e.g. every test skipped).
          MERMAID_TOKEN="$token" Rscript -e '
            res <- as.data.frame(testthat::test_local(
              filter = "mermaid_get_project_data|mermaid_get_summary_sampleevents",
              stop_on_failure = TRUE
            ))
            if (sum(res[["passed"]]) == 0) stop("No aggregate test passed: all skipped or none ran")
          '
