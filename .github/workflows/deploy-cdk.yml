name: DeployCDKStacks

on:
  push:
    branches:
      - dev
    tags:
      - 'v[0-9]+.[0-9]+'        # eg: v1.1
      - 'v[0-9]+.[0-9]+.[0-9]+' # eg: v1.1.1

      # The following tags allow you to deploy prod on the new AWS account only.
      # TODO: remove after migration
      - 'w[0-9]+.[0-9]+'        # eg: w1.1
      - 'w[0-9]+.[0-9]+.[0-9]+' # eg: w1.1.1

permissions:
  contents: read  # This is required for actions/checkout

jobs:
  call-test:
    uses: ./.github/workflows/_test.yml
    # Pass only the secrets _test.yml declares, instead of inheriting all.
    secrets:
      TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      TEST_POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
      TEST_MERMAID_API_SIGNING_SECRET: ${{ secrets.TEST_MERMAID_API_SIGNING_SECRET }}
      TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}

  deploy:
    needs: [call-test]
    # Job-level, not workflow-level, so the post-deploy aggregate-tests job doesn't hold
    # the deploy lock and make later pushes queue behind it. The lock serialises deploys
    # but not their order (call-test of two pushes runs in parallel), so a dev deploy
    # skips itself when dev has moved on; see "Skip if dev has a newer commit".
    # queue: max keeps every pending deploy; the default (one pending job) lets an older
    # push cancel the newest one's pending deploy, and then nothing deploys the newest commit.
    concurrency:
      group: api-deployment-${{ github.ref }}
      queue: max
    outputs:
      superseded: ${{ steps.newest.outputs.superseded }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for requesting the OIDC JWT (AWS role assume)
      contents: read   # required for actions/checkout
    # Tag pushes deploy prod; dev-branch pushes deploy dev. Selecting the matching
    # GitHub Environment resolves that env's SLACK_CHANNEL_ID / SLACK_WORKSPACE_ID
    # (and any other environment-scoped secrets); repo-level secrets still resolve.
    environment: ${{ startsWith(github.ref, 'refs/tags') && 'prod' || 'dev' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6.2.0  # zizmor: ignore[cache-poisoning] no `cache:` input set, so no cache is restored
        with:
          node-version: '^22.11.0'

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "^3.13.0"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install CDK
        run: |
          iac/install_cdk.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708  # v5.1.1
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          DEPLOY_AWS_ROLE: ${{ secrets.DEPLOY_AWS_ROLE }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.CDK_DEFAULT_ACCOUNT }}:role/${{ secrets.DEPLOY_AWS_ROLE }}
          role-duration-seconds: 3599
          aws-region: us-east-1
          role-skip-session-tagging: true

      # Runs after the deploy lock is held, right before the deploy. If a newer dev push
      # exists, its own run deploys it; deploying this older checkout would overwrite it.
      - name: Skip if dev has a newer commit
        id: newest
        if: startsWith(github.ref, 'refs/heads/dev')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$REPO/commits/dev" --jq .sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::Not deploying $GITHUB_SHA: dev is now at $latest, and that push's run deploys it."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: CDK Deploy DEV
        if: startsWith(github.ref, 'refs/heads/dev') && steps.newest.outputs.superseded != 'true'
        env:
          DEPLOY_AWS_ROLE: ${{ secrets.DEPLOY_AWS_ROLE }}
          SYS_EMAIL: ${{ secrets.SYS_EMAIL }}
          PYTHONPATH: ${{ github.workspace }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: us-east-1
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
        run: |
          short_sha=$(git rev-parse --short ${{ github.sha }}) && \
          echo "$short_sha" > src/VERSION.txt && \
          cat src/VERSION.txt && \
          cd iac && cdk deploy \
            --require-approval never \
            GithubAccess \
            mermaid-api-infra-common \
            mermaid-cloudtrail \
            "mermaid-guardduty-us-east-1" \
            dev-mermaid-inference \
            dev-mermaid-api-django \
            dev-mermaid-static-site \
            dev-mermaid-sagemaker
      - name: CDK Deploy PROD
        if: startsWith(github.ref, 'refs/tags')
        env:
          DEPLOY_AWS_ROLE: ${{ secrets.DEPLOY_AWS_ROLE }}
          SYS_EMAIL: ${{ secrets.SYS_EMAIL }}
          PYTHONPATH: ${{ github.workspace }}
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: us-east-1
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WORKSPACE_ID: ${{ secrets.SLACK_WORKSPACE_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$REF_NAME" > src/VERSION.txt && \
          cat src/VERSION.txt && \
          cd iac && cdk deploy \
            --require-approval never \
            GithubAccess \
            mermaid-api-infra-common \
            mermaid-cloudtrail \
            "mermaid-guardduty-us-east-1" \
            prod-mermaid-inference \
            prod-mermaid-api-django \
            prod-mermaid-static-site

  # mermaidr's aggregate-correctness tests (recalculate SU/SE values from the API's
  # observations and compare them with the API's own SU/SE output) against the dev API
  # just deployed. cdk deploy waits for the ECS service to stabilise, so the new code
  # is serving by now. Those tests are skip_on_ci()'d in mermaidr's own CI;
  # CI=false / NOT_CRAN=true below un-skips them.
  aggregate-tests:
    needs: [deploy]
    # Not when this push's deploy was skipped for a newer dev commit: that push's run
    # deploys and tests it.
    if: github.ref == 'refs/heads/dev' && needs.deploy.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # MERMAIDR_M2M_CLIENT_ID / MERMAIDR_M2M_CLIENT_SECRET live in a dedicated dev-tests
    # environment (not dev, so these runs aren't recorded as dev deployments): an Auth0
    # machine-to-machine app whose MERMAID profile is a read-only member of the mermaidr
    # test projects.
    environment: dev-tests
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      # Pinned: this code runs with a dev-API token. Bump the SHA deliberately after
      # reviewing mermaidr changes. Currently the merge commit of data-mermaid/mermaidr#166
      # (mermaidr 2.0.1: MERMAID_TOKEN / MERMAID_API_URL support).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: data-mermaid/mermaidr
          ref: 3000c635211363bd8aba9332dcfe11a9f7dcc31c
          path: mermaidr
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true

      # The test files only use mermaidr's Imports; skip its Suggests (tidyverse, etc.).
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: mermaidr
          dependencies: '"hard"'
          extra-packages: any::testthat

      # This job runs outside the deploy lock, so a later dev push can deploy while it
      # runs. APIVersionMiddleware sets http_api_version to the deployed short SHA (also
      # on a 401, so no token is needed). Test only if dev still serves this commit.
      - name: Check dev serves this commit
        id: rev_before
        shell: bash
        run: |
          rev=$(curl -sS -D - -o /dev/null https://dev-api.datamermaid.org/v1/ \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "http_api_version" { print $2 }')
          if [ -z "$rev" ]; then
            echo "::error::dev API returned no http_api_version header"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_SHA" != "$rev"* ]]; then
            echo "::notice::Not testing $GITHUB_SHA: dev now serves $rev, and that push's run tests it."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # The token is fetched and used in this one step, so no later step (including
      # third-party post-job steps) can read it.
      - name: Run mermaidr aggregate tests against dev
        if: steps.rev_before.outputs.stale != 'true'
        working-directory: mermaidr
        shell: bash
        env:
          AUTH0_CLIENT_ID: ${{ secrets.MERMAIDR_M2M_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.MERMAIDR_M2M_CLIENT_SECRET }}
          MERMAID_API_URL: https://dev-api.datamermaid.org
          CI: "false" # un-skips skip_on_ci()
          NOT_CRAN: "true" # un-skips skip_on_cran()
        run: |
          payload=$(jq -n --arg id "$AUTH0_CLIENT_ID" --arg secret "$AUTH0_CLIENT_SECRET" \
            '{grant_type: "client_credentials", client_id: $id, client_secret: $secret, audience: "https://dev-api.datamermaid.org"}')
          if ! response=$(curl -sS --fail-with-body https://datamermaid.auth0.com/oauth/token \
            -H "content-type: application/json" -d "$payload"); then
            echo "::error::Auth0 token request failed: $(jq -r '.error_description // .error // .' <<< "$response")"
            exit 1
          fi
          token=$(jq -r '.access_token // empty' <<< "$response")
          if [ -z "$token" ]; then
            echo "::error::No access token returned by Auth0"
            exit 1
          fi
          echo "::add-mask::$token"

          # No automatic retry: a failure is either a regression or a setup problem, and
          # both should surface. If a test project was edited mid-run (SU/SE read the
          # async summary cache), re-run the job.
          # Writes a per-test table to the run's summary page. Fails if any test fails
          # or errors, or if none passed (e.g. every test skipped).
          MERMAID_TOKEN="$token" Rscript -e '
            res <- as.data.frame(testthat::test_local(
              filter = "mermaid_get_project_data|mermaid_get_summary_sampleevents",
              stop_on_failure = FALSE
            ))
            bad <- res[["failed"]] > 0 | res[["error"]]
            rows <- sprintf("| %s | %s | %s | %d | %d | %d |",
              ifelse(bad, "❌", ifelse(res[["skipped"]], "⏭️", "✅")),
              res[["file"]], gsub("|", "\\|", res[["test"]], fixed = TRUE),
              res[["passed"]], res[["failed"]], as.integer(res[["skipped"]]))
            cat("### mermaidr aggregate tests\n\n",
                sprintf("%d passed, %d failed, %d tests with errors, %d skipped.\n\n",
                  sum(res[["passed"]]), sum(res[["failed"]]), sum(res[["error"]]), sum(res[["skipped"]])),
                "| | File | Test | Passed | Failed | Skipped |\n|---|---|---|---|---|---|\n",
                paste(rows, collapse = "\n"), "\n",
                sep = "", file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
            if (any(bad)) stop("Aggregate tests failed")
            if (sum(res[["passed"]]) == 0) stop("No aggregate test passed: all skipped or none ran")
          '

      # A deploy that lands mid-run means the tests may have hit two builds. Warn rather
      # than fail: the newer push's own run re-tests the build it deployed.
      - name: Check dev still serves the same build
        if: ${{ !cancelled() && steps.rev_before.outputs.stale != 'true' }}
        shell: bash
        env:
          REV_BEFORE: ${{ steps.rev_before.outputs.rev }}
        run: |
          rev=$(curl -sS -D - -o /dev/null https://dev-api.datamermaid.org/v1/ \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "http_api_version" { print $2 }')
          if [ "$rev" != "$REV_BEFORE" ]; then
            echo "::warning::dev changed from $REV_BEFORE to '$rev' during the tests; this run's results are inconclusive. The run for the newer push is authoritative."
          fi

  # CycloneDX SBOM of the API image for each deploy (card 2282), kept as a
  # workflow artifact. A separate job with no AWS access, so it cannot affect the
  # deploy. It builds the same `runtime` target CDK deploys; the deployed image
  # differs only by src/VERSION.txt, which holds no packages.
  # Image signing and provenance are deferred: CDK pushes the image, so its
  # digest is only known after `cdk deploy`.
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-trivy

      - name: Build image
        run: docker build --target runtime -t mermaid-api:sbom .

      - name: Generate SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json mermaid-api:sbom

      # Package list on the run's summary page, so it can be read without
      # downloading the artifact.
      - name: SBOM summary
        run: |
          jq -r '
            def lic: [.licenses[]?.license | .id // .name // empty] | unique | join(", ");
            def pkgs(t): [.components[] | select((.purl // "") | startswith("pkg:\(t)/"))] | sort_by(.name | ascii_downcase);
            def table(t): pkgs(t) | map("| \(.name) | \(.version) | \(lic) |") | join("\n");
            (.components[] | select(.type == "operating-system")) as $os
            | ([.metadata.component.properties[]? | select(.name == "aquasecurity:trivy:Size") | .value | tonumber] | first // 0) as $size
            | "### SBOM (CycloneDX \(.specVersion))\n",
              "\($os.name) \($os.version), image \($size / 1e6 | floor) MB: \(pkgs("pypi") | length) Python and \(pkgs("deb") | length) Debian packages. The full file is the `api-image-sbom` artifact.\n",
              "<details><summary>Python packages</summary>\n\n| Package | Version | License |\n|---|---|---|\n\(table("pypi"))\n\n</details>\n",
              "<details><summary>Debian packages</summary>\n\n| Package | Version | License |\n|---|---|---|\n\(table("deb"))\n\n</details>"
          ' sbom.cdx.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: api-image-sbom
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error
